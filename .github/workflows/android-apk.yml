name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "main.py"
      - "russian_chess/**"
      - "buildozer.spec"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip python3-virtualenv \
            autoconf libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev \
            libtinfo6 cmake libffi-dev libssl-dev automake autopoint gettext
          java -version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade "pip<25" wheel setuptools
          python -m pip install buildozer==1.5.0 cython==0.29.36
          python --version
          buildozer --version

      - name: Cache Android downloads only
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-stable2024-v1-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Reset local Android build state
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Apply Kivy startup hotfix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("russian_chess/ui_mobile.py")
          text = path.read_text(encoding="utf-8")
          found = text.count("self.pos")
          if found != 3:
              raise SystemExit(f"Expected exactly 3 self.pos references, found {found}")
          text = text.replace("self.pos=Label(color=MUTED)", "self.history_pos=Label(color=MUTED)", 1)
          text = text.replace("nav.add_widget(self.pos)", "nav.add_widget(self.history_pos)", 1)
          text = text.replace("self.pos.text=", "self.history_pos.text=", 1)
          if "self.pos" in text:
              raise SystemExit("Kivy reserved self.pos reference remains after patch")
          path.write_text(text, encoding="utf-8")
          print("Patched Root history-position label: self.pos -> self.history_pos")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          buildozer -v android debug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=$status"
          echo "----- LAST 300 BUILD LOG LINES -----"
          tail -n 300 build.log || true
          exit $status

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RussianChess-build-log
          path: build.log
          if-no-files-found: warn

      - name: Show APK
        run: find bin -maxdepth 1 -type f -name "*.apk" -print -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RussianChess-Android-debug
          path: bin/*.apk
          if-no-files-found: error
