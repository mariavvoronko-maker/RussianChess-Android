name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "main.py"
      - "russian_chess/**"
      - "buildozer.spec"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip python3-virtualenv \
            autoconf libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev \
            libtinfo6 cmake libffi-dev libssl-dev automake autopoint gettext
          java -version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install buildozer setuptools cython==0.29.36

      - name: Cache Android toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v2-${{ runner.os }}-

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          buildozer -v android debug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=$status"
          echo "----- LAST 250 BUILD LOG LINES -----"
          tail -n 250 build.log || true
          exit $status

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RussianChess-build-log
          path: build.log
          if-no-files-found: warn

      - name: Show APK
        run: find bin -maxdepth 1 -type f -name "*.apk" -print -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RussianChess-Android-debug
          path: bin/*.apk
          if-no-files-found: error
